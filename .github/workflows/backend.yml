name: Backend

on:
  push:
    branches: [main]
    # the contract lives in the frontend's types: a change there is checked against the backend too
    paths: ['backend/**', 'frontend/src/types/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'frontend/src/types/**', '.github/workflows/backend.yml']

defaults:
  run:
    working-directory: backend

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # the MongoDB binary the tests download (mongodb-memory-server)
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-8.0.4-${{ runner.os }}
      - run: npm run contract:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
