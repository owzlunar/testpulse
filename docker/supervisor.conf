; Runs nginx (web app + reverse proxy) and the API side by side; both log to the container's stdout.
[supervisord]
nodaemon=true
user=testpulse
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; local control socket for `supervisorctl status` inside the container (owner only)
[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:api]
command=node dist/index.js
directory=/app/backend
priority=10
autorestart=true
; up for 10 s = started (a database that can't be reached fails within ~5 s); 3 failed starts -> FATAL
startsecs=10
startretries=3
; the API finishes in-flight requests and closes MongoDB within 10 s
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
priority=20
autorestart=true
stopsignal=QUIT
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; if either process keeps failing, stop the container so the orchestrator restarts it
[eventlistener:exit_on_fatal]
command=sh -c 'printf "READY\n"; while read line; do kill -TERM 1; printf "RESULT 2\nOK"; done'
events=PROCESS_STATE_FATAL
stdout_logfile=/dev/null
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
