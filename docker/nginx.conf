# The workers (which serve requests) run as "testpulse"; every writable path is under /tmp/nginx.
user testpulse;
worker_processes auto;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;

  client_body_temp_path /tmp/nginx/client_body;
  proxy_temp_path /tmp/nginx/proxy;
  fastcgi_temp_path /tmp/nginx/fastcgi;
  uwsgi_temp_path /tmp/nginx/uwsgi;
  scgi_temp_path /tmp/nginx/scgi;

  # keep the scheme / host the outer reverse proxy saw (https), or ours when there is none
  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # the API listens only inside the container
  upstream api {
    server 127.0.0.1:8081;
    keepalive 16;
  }

  server {
    listen 8080;
    root /app/frontend;
    # redirects keep the path only, so they work behind a proxy (other host, https, sub path)
    absolute_redirect off;

    # BASE_URL's sub path (written by docker/entrypoint.sh; empty at the root of a domain)
    include /tmp/nginx/base-path.conf;

    # uploads (UPLOAD_MAX_BYTES 2 MB) plus multipart overhead; the API enforces the real limit
    client_max_body_size 3m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # event streams (GET /api/v1/notifications/stream): the API answers them with X-Accel-Buffering: no
    # (this nginx then sends every event at once) and a heartbeat every 25 s, inside proxy_read_timeout
    # (60 s). The header is passed on, not dropped as X-Accel-* headers are by default, so an nginx in
    # front of the image (the deployment's reverse proxy) doesn't hold the stream back either.
    location /api/ {
      proxy_pass http://api;
      proxy_pass_header X-Accel-Buffering;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Request-Id $request_id;
    }

    location /health/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }

    # hashed build files never change
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header X-Content-Type-Options nosniff always;
      try_files $uri =404;
    }

    # the app's routes (history mode) all load index.html, which is never cached
    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache" always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header X-Frame-Options DENY always;
    }
  }
}
