# The off-site machine: a MinIO the prod server's backup.sh mirrors to, behind nginx with the wildcard
# certificate. Only 443 is published, and nginx.conf lets in only the prod server's IP.
#
#   .env              MINIO_ROOT_USER / MINIO_ROOT_PASSWORD (chmod 600), the prod's OFFSITE_S3_* in backup.env
#   nginx.conf        the host name and the prod server's IP
#   certs/            fullchain.pem + privkey.pem
#
#   docker compose up -d

name: testpulse-mirror

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

services:
  minio-mirror:
    # pinned, the same as the prod's minio
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio-mirror
    restart: unless-stopped
    ports:
      # web console, this machine only (ssh -L 9100:127.0.0.1:9100 <mirror>)
      - '127.0.0.1:9100:9000'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - ./minio-mirror/data:/data
    command: server --address :9001 --console-address :9000 /data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9001/minio/health/live']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging: *logging

  proxy:
    image: nginx:alpine
    container_name: mirror-proxy
    ports:
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - minio-mirror
    restart: unless-stopped
    logging: *logging
