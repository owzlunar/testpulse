# https in front of the mirror's S3 API. Change `backup.example.com` and `203.0.113.10` (the prod
# server's public IP; add a line per machine that may back up or restore from here).
# Docker publishes 443 past ufw, so this allow list is what keeps everyone else out.
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name backup.example.com;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  allow 203.0.113.10;
  deny all;

  # S3 needs: any object size, the headers as they are, no buffering (MinIO's nginx guide)
  ignore_invalid_headers off;
  client_max_body_size 0;
  proxy_buffering off;
  proxy_request_buffering off;

  location / {
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 300;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    chunked_transfer_encoding off;
    proxy_pass http://minio-mirror:9001;
  }
}
