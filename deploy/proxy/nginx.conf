# The reverse proxy in front of TestPulse: https with the wildcard certificate, the app under /testpulse.
# Change `qa.example.com` (two places) to the real host name; BASE_URL in .env.prod must match:
# https://qa.example.com/testpulse
gzip on;
gzip_types text/plain text/css application/json application/javascript text/event-stream;
gzip_min_length 0;
gzip_proxied any;

# http: only a redirect to https
server {
  listen 80;
  listen [::]:80;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name qa.example.com;

  # the wildcard certificate: fullchain.pem = the certificate + the CA's intermediate(s), privkey.pem = its key
  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  add_header Strict-Transport-Security "max-age=31536000" always;

  # the same limit as the app's own nginx (images, Excel imports); nginx's default 1m answers 413
  client_max_body_size 3m;

  # the app by name, looked up again every 10 s (Docker's DNS): a recreated container (a new version)
  # gets a new address, which a plain `proxy_pass http://testpulse:8080` would never see (502 until a restart)
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $app http://testpulse:8080;

  location /testpulse/ {
    proxy_pass $app;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # notifications (server-sent events): unbuffered, kept open
  location /testpulse/api/v1/notifications/stream {
    proxy_pass $app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 1h;
  }

  location = / {
    return 302 /testpulse/;
  }
}
