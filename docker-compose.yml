# The testpulse image against services that run elsewhere (here: on the Docker host).
#   docker compose up -d --build        -> http://localhost:8080
#
# Settings: backend/.env (shared defaults, in git) + backend/.env.prod (this deployment: database,
# storage, SMTP, secrets; not in git, create it with `npm --prefix backend run env:init -- prod`).
# Anything under `environment` below overrides both files.
#
# Every connection is checked when the container starts: if MongoDB, the storage or the mail server
# can't be reached (or the folders can't be written) the container stops with the reason in
# `docker logs testpulse`. On an empty database set INITIAL_ADMIN_EMAIL / INITIAL_ADMIN_PASSWORD in
# .env.prod for the first start (the first Admin).
# Test mail server: Mailpit on the host, SMTP :1025, inbox http://localhost:8025
#   docker run -d --name mailpit --restart unless-stopped -p 1025:1025 -p 8025:8025 axllent/mailpit

services:
  testpulse:
    build: .
    image: testpulse
    container_name: testpulse
    ports:
      # nginx only: the API (8081) is not published
      - '8080:8080'
    env_file:
      - backend/.env
      - backend/.env.prod
    # environment:
    #   LOG_LEVEL: debug
    volumes:
      # uploaded files (STORAGE_DRIVER=local) and access / error logs, kept on the host
      - ./docker-data/uploads:/app/backend/storage/uploads
      - ./docker-data/logs:/app/backend/logs
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped
